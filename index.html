<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Writing Program</title>
</head>
<body>
    <header>
        <h1>Writing Program</h1>
        <div id="LanguageSelection">
            <label for="langSelect">Language:</label>
            <select id="langSelect">
                <option value="english">English</option>
                <option value="polish">Polski</option>
                <option value="russian">Russian</option>
                <option value="swedish">Swedish</option>
            </select>
            <div id="day_nightToggleSwitch">
            <label id="switch">
                <input type="checkbox" id="nightModeInput">
                <span>Night Mode</span>
            </label>
            </div>
        </div>
    </header>
    <main>
    <div id="TextDisplay">
        <div id="ProgressBar"></div>
        <div id="TextContent"></div>
    </div>
    <div id="TimeDisplay">
        <span class="timer-label">CZAS:</span>
        <p id="timer">0:00</p>
    </div>
    <input type="text" id="userInput" autocomplete="off" autofocus placeholder="Naciśnij ESC aby zrestartować">
</main>
    <script src="script.js"></script>
</body>
</html>
